spring.application.name=localizacao

firebase.database-url=https://busco-928b1-default-rtdb.firebaseio.com
tracking.antifraud.max-speed=150
tracking.antifraud.max-distance-jump=500

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka: entrada das posicoes publicadas pelo tracking-ingestion-service.
# A chave da mensagem e viagemId (topico de veiculo) ou alunoId (topico de aluno), o que preserva a
# ordem por entidade. Offset comeca no fim (tempo real); o commit e manual e so acontece depois do
# pipeline concluir, para nao perder posicao em caso de falha.
tracking.topico-veiculo=${TRACKING_TOPIC:tracking.posicao-veiculo.v1}
tracking.topico-aluno=${TRACKING_ALUNO_TOPIC:tracking.posicao-aluno.v1}
tracking.tempo-limite-processamento-ms=${TRACKING_TIMEOUT_MS:15000}
tracking.idempotencia.ttl-minutos=${TRACKING_IDEMPOTENCIA_TTL_MIN:10}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:localizacao-core}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# O produtor publica sem type headers: o tipo alvo vem por listener (spring.json.value.default.type)
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=${TRACKING_CONCURRENCY:3}
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JPA / Postgres / Flyway
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/busco}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=localizacao
spring.flyway.enabled=true
spring.flyway.schemas=localizacao
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
