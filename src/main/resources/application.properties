spring.application.name=localizacao

firebase.database-url=https://busco-928b1-default-rtdb.firebaseio.com
tracking.antifraud.max-speed=150
tracking.antifraud.max-distance-jump=500

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JPA / Postgres / Flyway
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/busco}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=localizacao
spring.flyway.enabled=true
spring.flyway.schemas=localizacao
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
