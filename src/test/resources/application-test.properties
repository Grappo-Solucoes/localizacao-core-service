# Tracking
tracking.antifraud.max-speed=150
tracking.antifraud.max-distance-jump=500

# Chegada
app.chegada.distancia-metros=300
app.chegada.ttl-minutos=120

# Live view
app.live-view.keepalive-seconds=60

# Kafka: os listeners nao sobem no build default (nao ha broker no ambiente de teste).
# O teste de integracao reativa com spring.kafka.listener.auto-startup=true.
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=localizacao-core-test
