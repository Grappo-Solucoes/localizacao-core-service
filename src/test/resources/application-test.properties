# Test profile: uses H2 in-memory, connects to real Redis/RabbitMQ containers
# NAO reintroduzir spring.profiles.active aqui: este arquivo JA e profile-specific
# (application-test.properties), e o Spring Boot 3 rejeita a propriedade nessa origem
# com InvalidConfigDataPropertyException, derrubando o carregamento de contexto.
# A ativacao vem de @ActiveProfiles("test") nas classes de teste.

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=localizacao

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=localizacao
spring.flyway.locations=classpath:db/migration

# Redis (container)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ (container)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

